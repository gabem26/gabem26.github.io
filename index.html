<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="rain"></canvas>
<div class="vignette"></div>
<div class="scanlines"></div>

<main>
  <section class="terminal">
    <div class="bar">
      <i class="red"></i><i class="amber"></i><i class="green"></i>
      <span>1+0=10</span>
    </div>
    <div class="body">
      <h1 data-text="BLOG">BLOG</h1>
      <pre>&gt; type "help" for commands, or just type a blog name.</pre>
      <div class="prompt"><label>root@haunted-host:~#</label><input spellcheck="false"></div>
      <div class="buttons"><button id="pause" type="button">[ PAUSE THE RAIN ]</button></div>
    </div>
  </section>
</main>

<script>
/* Binary rain: falling 1s and 0s */
var cv = document.getElementById('rain'), ctx = cv.getContext('2d');
var size = 18, w, h, drops = [], speed = [], on = true;

var pb = document.getElementById('pause');
pb.onclick = function () { on = !on; pb.textContent = on ? '[ PAUSE THE RAIN ]' : '[ RESUME THE RAIN ]'; };

function resize() {
  w = cv.width = innerWidth;
  h = cv.height = innerHeight;
  for (var i = drops.length; i < Math.ceil(w / size); i++) {
    drops[i] = -Math.random() * 50;
    speed[i] = 0.5 + Math.random();
  }
}
addEventListener('resize', resize);
resize();

setInterval(function () {
  if (!on) return;
  ctx.fillStyle = 'rgba(0,0,0,0.09)';                 // fade = trail
  ctx.fillRect(0, 0, w, h);
  ctx.font = 'bold ' + size + 'px monospace';
  ctx.textBaseline = 'top';
  for (var i = 0; i < Math.ceil(w / size); i++) {
    var x = i * size, y = drops[i] * size, r = Math.random();
    var c = r > .985 ? '#ff6a00' : r > .972 ? '#ff1744' : '#00ff41';
    ctx.fillStyle = '#d6ffe0';                        // bright head
    ctx.shadowColor = c;
    ctx.shadowBlur = 8;
    ctx.fillText(Math.random() > .5 ? 1 : 0, x, y);
    ctx.shadowBlur = 0;
    ctx.fillStyle = c;                                // colored digit behind it
    ctx.fillText(Math.random() > .5 ? 1 : 0, x, y - size);
    if (y > h && Math.random() > .975) drops[i] = -Math.random() * 20;
    drops[i] += speed[i];
  }
}, 45);
</script>
</body>
</html>
