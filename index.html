<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>// THE HAUNTED TERMINAL</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="rain"></canvas>

<main>
  <section class="terminal">
    <div class="bar"><i class="r"></i><i class="a"></i><i class="g"></i></div>
    <div class="body">
      <h1 data-text="ENTER IF YOU DARE">ENTER IF YOU DARE</h1>
      <p class="tag">// the machine is awake. type a blog name. it will open.</p>
      <pre id="out"></pre>
      <form id="form" autocomplete="off">
        <label for="cmd">root@haunted-host:~#</label>
        <input id="cmd" spellcheck="false" autocapitalize="off" disabled>
      </form>
      <div class="buttons">
        <button id="pause" type="button"></button>
      </div>
    </div>
  </section>
</main>

<script>
/* ---------- Binary rain ---------- */
var cv = document.getElementById('rain'), ctx = cv.getContext('2d');
var size = 18, w, h, drops = [], speed = [];
var on = !matchMedia('(prefers-reduced-motion: reduce)').matches;   // rain running?
var pb = document.getElementById('pause');

function label() { pb.textContent = on ? '[ PAUSE THE RAIN ]' : '[ RESUME THE RAIN ]'; }
pb.onclick = function () { on = !on; label(); };
label();

function resize() {
  w = cv.width = innerWidth;
  h = cv.height = innerHeight;
  for (var i = drops.length; i < Math.ceil(w / size); i++) {
    drops[i] = -Math.random() * 50;
    speed[i] = 0.5 + Math.random();
  }
}
addEventListener('resize', resize);
resize();

setInterval(function () {
  if (!on) return;
  ctx.fillStyle = 'rgba(0,0,0,0.09)';          // fade = trail
  ctx.fillRect(0, 0, w, h);
  ctx.font = 'bold ' + size + 'px monospace';
  ctx.textBaseline = 'top';
  for (var i = 0; i < Math.ceil(w / size); i++) {
    var x = i * size, y = drops[i] * size, r = Math.random();
    var c = r > .985 ? '#ff6a00' : r > .972 ? '#ff1744' : '#00ff41';  // green, orange, red
    ctx.fillStyle = '#d6ffe0';                  // bright head with glow
    ctx.shadowColor = c;
    ctx.shadowBlur = 8;
    ctx.fillText(Math.random() > .5 ? 1 : 0, x, y);
    ctx.shadowBlur = 0;
    ctx.fillStyle = c;                          // colored digit behind it
    ctx.fillText(Math.random() > .5 ? 1 : 0, x, y - size);
    if (y > h && Math.random() > .975) drops[i] = -Math.random() * 20;
    drops[i] += speed[i];
  }
}, 45);

/* ---------- Terminal ---------- */
var out = document.getElementById('out');
var cmd = document.getElementById('cmd');
var hist = [], hi = 0;

// Add your own blogs here: name (lowercase, no spaces) : url
var BLOGS = {
  krebs: 'https://krebsonsecurity.com',
  schneier: 'https://www.schneier.com',
  hackernews: 'https://thehackernews.com',
  bleepingcomputer: 'https://www.bleepingcomputer.com',
  troyhunt: 'https://www.troyhunt.com',
  darkreading: 'https://www.darkreading.com',
  '404media': 'https://www.404media.co',
  daringfireball: 'https://daringfireball.net',
  paulgraham: 'https://paulgraham.com',
  overreacted: 'https://overreacted.io',
  joelonsoftware: 'https://www.joelonsoftware.com',
  codinghorror: 'https://blog.codinghorror.com',
  martinfowler: 'https://martinfowler.com',
  stratechery: 'https://stratechery.com',
  xkcd: 'https://xkcd.com',
  hn: 'https://news.ycombinator.com'
};

function println(t) {
  out.textContent += '\n' + t;
  out.scrollTop = out.scrollHeight;
}

function go(q) {
  var u = BLOGS[q.toLowerCase().replace(/[^a-z0-9]/g, '')];
  if (!u) u = /^(https?:\/\/)?[\w-]+(\.[\w-]+)+\S*$/i.test(q)
    ? (/^https?:/i.test(q) ? q : 'https://' + q)                                  // domain / url
    : 'https://duckduckgo.com/?q=' + encodeURIComponent('!ducky ' + q + ' blog'); // lucky search
  println('> opening ' + u);
  if (!window.open(u, '_blank', 'noopener')) println('> popup blocked. allow popups and retry.');
}

document.getElementById('form').onsubmit = function (e) {
  e.preventDefault();
  var v = cmd.value.trim();
  cmd.value = '';
  if (!v) return;
  hist.push(v); hi = hist.length;
  println('root@haunted-host:~# ' + v);
  var l = v.toLowerCase();
  if (l == 'clear') out.textContent = '';
  else if (l == 'list') println('> ' + Object.keys(BLOGS).join(', '));
  else if (l == 'help') println('> type a blog name, domain, or url.  commands: list, clear, help');
  else go(v.replace(/^open\s+/i, ''));
};

cmd.onkeydown = function (e) {   // up/down = history
  if (e.key == 'ArrowUp' && hi > 0) cmd.value = hist[--hi];
  else if (e.key == 'ArrowDown') cmd.value = hist[++hi] || (hi = hist.length, '');
  else return;
  e.preventDefault();
};

document.onclick = function () { if (!cmd.disabled) cmd.focus(); };

// typed intro
var intro = '> initializing haunted_protocol.exe ...\n> bypassing firewall ........ [OK]\n' +
  '> decrypting souls ........... [OK]\n> WARNING: unknown presence detected on port 1031\n' +
  '> it is Halloween. the dead are online.\n' +
  '> type "help" for commands, or just type a blog name.\n', n = 0;
var t = setInterval(function () {
  out.textContent = intro.slice(0, ++n);
  if (n >= intro.length) { clearInterval(t); cmd.disabled = false; cmd.focus(); }
}, 20);
</script>
</body>
</html>
