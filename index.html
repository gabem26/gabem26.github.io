<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>// THE HAUNTED TERMINAL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Falling 1s and 0s -->
  <canvas id="rain" aria-hidden="true"></canvas>

  <!-- Spooky overlays -->
  <div class="vignette" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="stage">
    <section class="terminal">
      <header class="terminal-bar">
        <span class="dot red"></span>
        <span class="dot amber"></span>
        <span class="dot green"></span>
        <span class="terminal-title">root@haunted-host:~# </span>
      </header>

      <div class="terminal-body">
        <h1 class="glitch" data-text="ENTER IF YOU DARE">ENTER IF YOU DARE</h1>
        <p class="tagline">// the machine is awake. it knows your name.</p>

        <pre id="output" class="output" aria-live="polite"></pre>

        <div class="buttons">
          <button id="summon" type="button">[ SUMMON THE GHOST ]</button>
          <button id="toggle" type="button">[ PAUSE THE RAIN ]</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      /* ---------- Binary rain ---------- */
      var canvas = document.getElementById('rain');
      var ctx = canvas.getContext('2d');
      var fontSize = 18;
      var columns = 0;
      var drops = [];
      var speeds = [];
      var width = 0, height = 0;
      var running = true;
      var lastTime = 0;
      var frameInterval = 45; // ms between steps

      function resize() {
        var dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);

        columns = Math.ceil(width / fontSize);
        var old = drops.length;
        drops.length = columns;
        speeds.length = columns;
        for (var i = old; i < columns; i++) {
          drops[i] = Math.floor(Math.random() * -50); // staggered start above screen
          speeds[i] = 0.5 + Math.random() * 1.0;
        }
      }

      function draw(time) {
        requestAnimationFrame(draw);
        if (!running) return;
        if (time - lastTime < frameInterval) return;
        lastTime = time;

        // Fade previous frame to leave a trail
        ctx.fillStyle = 'rgba(0, 0, 0, 0.09)';
        ctx.fillRect(0, 0, width, height);

        ctx.font = 'bold ' + fontSize + 'px "Courier New", monospace';
        ctx.textBaseline = 'top';

        for (var i = 0; i < columns; i++) {
          var y = drops[i] * fontSize;
          var x = i * fontSize;
          var ch = Math.random() > 0.5 ? '1' : '0';

          // Trail character in green (spooky orange / blood red sprinkled in)
          var roll = Math.random();
          var color = '#00ff41';
          if (roll > 0.985) color = '#ff6a00';
          else if (roll > 0.972) color = '#ff1744';

          // Bright "head" of the stream
          ctx.fillStyle = '#d6ffe0';
          ctx.shadowColor = color;
          ctx.shadowBlur = 8;
          ctx.fillText(ch, x, y);

          // Overdraw the character just behind the head in the color
          ctx.fillStyle = color;
          ctx.shadowBlur = 0;
          ctx.fillText(Math.random() > 0.5 ? '1' : '0', x, y - fontSize);

          // Reset to top after leaving the screen (random delay)
          if (y > height && Math.random() > 0.975) {
            drops[i] = Math.floor(Math.random() * -20);
            speeds[i] = 0.5 + Math.random() * 1.0;
          }
          drops[i] += speeds[i];
        }
      }

      window.addEventListener('resize', resize);
      resize();

      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) running = false;
      requestAnimationFrame(draw);

      var toggleBtn = document.getElementById('toggle');
      function syncToggle() {
        toggleBtn.textContent = running ? '[ PAUSE THE RAIN ]' : '[ RESUME THE RAIN ]';
      }
      syncToggle();
      toggleBtn.addEventListener('click', function () {
        running = !running;
        syncToggle();
      });

      /* ---------- Terminal typing ---------- */
      var out = document.getElementById('output');
      var lines = [
        '> initializing haunted_protocol.exe ...',
        '> bypassing firewall ........ [OK]',
        '> decrypting souls ........... [OK]',
        '> WARNING: unknown presence detected on port 1031',
        '> it is Halloween. the dead are online.',
        '> awaiting input_'
      ];

      var typing = false;
      function typeLines(list, done) {
        if (typing) return;
        typing = true;
        out.textContent = '';
        var li = 0, ci = 0;
        (function step() {
          if (li >= list.length) { typing = false; if (done) done(); return; }
          var line = list[li];
          if (ci <= line.length) {
            var prior = list.slice(0, li).join('\n') + (li ? '\n' : '');
            out.textContent = prior + line.slice(0, ci);
            ci++;
            setTimeout(step, 22 + Math.random() * 30);
          } else {
            li++; ci = 0;
            setTimeout(step, 260);
          }
        })();
      }
      typeLines(lines);

      /* ---------- Summon button ---------- */
      var ghostLines = [
        '> summoning ...',
        '> 01001000 01000001 01001100 01001100 01001111',
        '> 01010111 01000101 01000101 01001110',
        '> you are not alone in this terminal.',
        '> BOO.'
      ];
      document.getElementById('summon').addEventListener('click', function () {
        document.body.classList.add('haunted');
        setTimeout(function () { document.body.classList.remove('haunted'); }, 1600);
        typeLines(ghostLines);
      });
    })();
  </script>
</body>
</html>
