<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>// THE HAUNTED TERMINAL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Falling 1s and 0s -->
  <canvas id="rain" aria-hidden="true"></canvas>

  <!-- Spooky overlays -->
  <div class="vignette" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="stage">
    <section class="terminal" id="terminal">
      <header class="terminal-bar">
        <span class="dot red"></span>
        <span class="dot amber"></span>
        <span class="dot green"></span>
        <span class="terminal-title">1+0=10</span>
      </header>

      <div class="terminal-body">
        <h1 class="glitch" data-text="BLOG">BLOG</h1>
        <!-- <p class="tagline">// ......</p> -->

        <pre id="output" class="output" aria-live="polite"></pre>

        <form id="promptLine" class="prompt-line" autocomplete="off">
          <label for="cmd" class="prompt">root@haunted-host:~#</label>
          <input id="cmd" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" disabled>
        </form>

        <div class="buttons">
          <button id="toggle" type="button">[ PAUSE THE RAIN ]</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      /* ---------- Binary rain ---------- */
      var canvas = document.getElementById('rain');
      var ctx = canvas.getContext('2d');
      var fontSize = 18;
      var columns = 0;
      var drops = [];
      var speeds = [];
      var width = 0, height = 0;
      var running = true;
      var lastTime = 0;
      var frameInterval = 45; // ms between steps

      function resize() {
        var dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);

        columns = Math.ceil(width / fontSize);
        var old = drops.length;
        drops.length = columns;
        speeds.length = columns;
        for (var i = old; i < columns; i++) {
          drops[i] = Math.floor(Math.random() * -50); // staggered start above screen
          speeds[i] = 0.5 + Math.random() * 1.0;
        }
      }

      function draw(time) {
        requestAnimationFrame(draw);
        if (!running) return;
        if (time - lastTime < frameInterval) return;
        lastTime = time;

        // Fade previous frame to leave a trail
        ctx.fillStyle = 'rgba(0, 0, 0, 0.09)';
        ctx.fillRect(0, 0, width, height);

        ctx.font = 'bold ' + fontSize + 'px "Courier New", monospace';
        ctx.textBaseline = 'top';

        for (var i = 0; i < columns; i++) {
          var y = drops[i] * fontSize;
          var x = i * fontSize;
          var ch = Math.random() > 0.5 ? '1' : '0';

          // Trail character in green (spooky orange / blood red sprinkled in)
          var roll = Math.random();
          var color = '#00ff41';
          if (roll > 0.985) color = '#ff6a00';
          else if (roll > 0.972) color = '#ff1744';

          // Bright "head" of the stream
          ctx.fillStyle = '#d6ffe0';
          ctx.shadowColor = color;
          ctx.shadowBlur = 8;
          ctx.fillText(ch, x, y);

          // Overdraw the character just behind the head in the color
          ctx.fillStyle = color;
          ctx.shadowBlur = 0;
          ctx.fillText(Math.random() > 0.5 ? '1' : '0', x, y - fontSize);

          // Reset to top after leaving the screen (random delay)
          if (y > height && Math.random() > 0.975) {
            drops[i] = Math.floor(Math.random() * -20);
            speeds[i] = 0.5 + Math.random() * 1.0;
          }
          drops[i] += speeds[i];
        }
      }

      window.addEventListener('resize', resize);
      resize();

      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) running = false;
      requestAnimationFrame(draw);

      var toggleBtn = document.getElementById('toggle');
      function syncToggle() {
        toggleBtn.textContent = running ? '[ PAUSE THE RAIN ]' : '[ RESUME THE RAIN ]';
      }
      syncToggle();
      toggleBtn.addEventListener('click', function () {
        running = !running;
        syncToggle();
      });

      /* ---------- Terminal ---------- */
      var PROMPT = 'root@haunted-host:~# ';
      var out = document.getElementById('output');
      var form = document.getElementById('promptLine');
      var input = document.getElementById('cmd');
      var terminal = document.getElementById('terminal');

      // Known blogs: key (lowercase, letters/numbers only) -> URL
      var BLOGS = {
        krebsonsecurity: 'https://krebsonsecurity.com',
        krebs:           'https://krebsonsecurity.com',
        schneier:        'https://www.schneier.com',
        thehackernews:   'https://thehackernews.com',
        hackernews:      'https://thehackernews.com',
        bleepingcomputer:'https://www.bleepingcomputer.com',
        troyhunt:        'https://www.troyhunt.com',
        darkreading:     'https://www.darkreading.com',
        '404media':      'https://www.404media.co',
        daringfireball:  'https://daringfireball.net',
        paulgraham:      'https://paulgraham.com',
        overreacted:     'https://overreacted.io',
        joelonsoftware:  'https://www.joelonsoftware.com',
        codinghorror:    'https://blog.codinghorror.com',
        martinfowler:    'https://martinfowler.com',
        stratechery:     'https://stratechery.com',
        xkcd:            'https://xkcd.com',
        hn:              'https://news.ycombinator.com',
        ycombinator:     'https://news.ycombinator.com'
      };

      var typing = false;

      function setBusy(busy) {
        input.disabled = busy;
        if (!busy) input.focus();
      }

      function scrollDown() {
        out.scrollTop = out.scrollHeight;
      }

      function println(text) {
        out.textContent += (out.textContent ? '\n' : '') + text;
        scrollDown();
      }

      // Types lines out one char at a time, replacing the output
      function typeLines(list, done) {
        if (typing) return;
        typing = true;
        setBusy(true);
        out.textContent = '';
        var li = 0, ci = 0;
        (function step() {
          if (li >= list.length) {
            typing = false;
            setBusy(false);
            if (done) done();
            return;
          }
          var line = list[li];
          if (ci <= line.length) {
            var prior = list.slice(0, li).join('\n') + (li ? '\n' : '');
            out.textContent = prior + line.slice(0, ci);
            scrollDown();
            ci++;
            setTimeout(step, 18 + Math.random() * 26);
          } else {
            li++; ci = 0;
            setTimeout(step, 220);
          }
        })();
      }

      var introLines = [
        '> initializing haunted_protocol.exe ...',
        '> bypassing firewall ........ [OK]',
        '> decrypting souls ........... [OK]',
        '> WARNING: unknown presence detected on port 1031',
        '> it is Halloween. the dead are online.',
        '> type "help" for commands, or just type a blog name.'
      ];
      typeLines(introLines);

      /* ---------- Opening blogs ---------- */
      function openUrl(url, label) {
        println('> opening ' + label + ' ... ' + url);
        var win = window.open(url, '_blank');
        if (win) win.opener = null;
        else println('> popup blocked! allow popups for this page and try again.');
      }

      function looksLikeUrl(s) {
        return /^https?:\/\/\S+$/i.test(s) || /^(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)+(\/\S*)?$/i.test(s);
      }

      function openBlog(raw) {
        var q = raw.trim();
        if (!q) return;

        // 1) A full URL or domain: open as-is
        if (looksLikeUrl(q)) {
          var url = /^https?:\/\//i.test(q) ? q : 'https://' + q;
          openUrl(url, q);
          return;
        }

        // 2) A known blog name
        var key = q.toLowerCase().replace(/[^a-z0-9]/g, '');
        if (BLOGS[key]) {
          openUrl(BLOGS[key], q);
          return;
        }

        // 3) Unknown: "I'm feeling lucky" search for the blog
        println('> no local record of "' + q + '". asking the void ...');
        var lucky = 'https://duckduckgo.com/?q=' + encodeURIComponent('!ducky ' + q + ' blog');
        openUrl(lucky, q + ' (lucky search)');
      }

      function listBlogs() {
        var seen = {};
        var names = [];
        Object.keys(BLOGS).forEach(function (k) {
          var u = BLOGS[k];
          if (!seen[u]) { seen[u] = true; names.push(k); }
        });
        println('> known blogs:\n  ' + names.join(', '));
        println('> anything else gets a lucky search, or type a domain.');
      }

      /* ---------- Command handling ---------- */
      var history = [];
      var histIndex = 0;

      function run(raw) {
        var cmd = raw.trim();
        println(PROMPT + raw);
        if (!cmd) return;

        history.push(cmd);
        histIndex = history.length;

        var lower = cmd.toLowerCase();
        var parts = cmd.split(/\s+/);
        var first = parts[0].toLowerCase();

        if (lower === 'help' || lower === '?') {
          println(
            '> commands:\n' +
            '  <blog name>     open a blog (e.g. krebs, schneier, 404media)\n' +
            '  open <name|url> same thing, explicitly\n' +
            '  list            show known blogs\n' +
            '  clear           wipe the screen\n' +
            '  help            this message'
          );
        } else if (lower === 'list' || lower === 'ls') {
          listBlogs();
        } else if (lower === 'clear' || lower === 'cls') {
          out.textContent = '';
        } else if (first === 'open' || first === 'cd' || first === 'goto') {
          var rest = cmd.slice(parts[0].length).trim();
          if (rest) openBlog(rest);
          else println('> usage: open <blog name or url>');
        } else {
          openBlog(cmd);
        }
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (typing) return;
        var value = input.value;
        input.value = '';
        run(value);
      });

      input.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowUp') {
          if (history.length && histIndex > 0) {
            histIndex--;
            input.value = history[histIndex];
          }
          e.preventDefault();
        } else if (e.key === 'ArrowDown') {
          if (histIndex < history.length - 1) {
            histIndex++;
            input.value = history[histIndex];
          } else {
            histIndex = history.length;
            input.value = '';
          }
          e.preventDefault();
        }
      });

      // Clicking anywhere on the terminal focuses the prompt
      terminal.addEventListener('click', function (e) {
        if (e.target.tagName !== 'BUTTON' && !input.disabled) input.focus();
      });
    })();
  </script>
</body>
</html>
